name: womb_wisdom_flutter
description: "Womb Wisdom Wellbeing App - A prenatal health and wellbeing application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_animate: ^4.2.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  badges: ^3.0.2
  flutter_rating_bar: ^4.0.1
  flutter_advanced_switch: ^2.1.0
  flutter_staggered_animations: ^1.1.1
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.1
  
  # Date & Time
  intl: ^0.19.0
  
  # Icons
  font_awesome_flutter: ^10.6.0
  
  # HTTP & API
  http: ^1.1.2
  
  # Supabase
  supabase_flutter: ^2.0.1
  
  # Utilities
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  # flutter_secure_storage: ^9.0.0  # Temporarily disabled due to win32 compatibility issue
  image_picker: ^1.0.4
  path: ^1.8.3
  
  # Animations
  animations: ^2.0.7
  
  # Calendar
  table_calendar: ^3.0.9
  flutter_launcher_icons: ^0.14.4
  
  # Charts and Analytics
  fl_chart: ^0.68.0
  
  # Notifications
  flutter_local_notifications: ^17.2.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FF6B6B"
    theme_color: "#FF6B6B"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

dependency_overrides:
  win32: 5.1.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
